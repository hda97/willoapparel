name: Uji posting IG Lumbung (sementara)

# Uji jalur posting otomatis ke @miftakhul_hda tanpa menerbitkan apa pun. Dihapus setelah lulus.
on:
  push:
    branches: [claude/project-thread-sb477z]
    paths: [".github/workflows/ig-uji-lumbung.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: konten-ig
      - name: Uji (tanpa terbit)
        env:
          IG_USERNAME: miftakhul_hda
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          UJI_VIDEO: https://raw.githubusercontent.com/hda97/willoapparel/e0249503934543ef5487814fe6b2463665f8b74c/lumbung-ig/eps4-konter.mp4
          UJI_SAMPUL: https://raw.githubusercontent.com/hda97/willoapparel/e0249503934543ef5487814fe6b2463665f8b74c/lumbung-ig/eps4-konter-sampul.jpg
          UJI_GAMBAR: "https://raw.githubusercontent.com/hda97/willoapparel/e0249503934543ef5487814fe6b2463665f8b74c/lumbung-ig/feed/f1-1.jpg https://raw.githubusercontent.com/hda97/willoapparel/e0249503934543ef5487814fe6b2463665f8b74c/lumbung-ig/feed/f1-2.jpg"
        run: python3 konten-ig/posting.py
