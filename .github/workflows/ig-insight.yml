name: Insight Instagram Dunia Kotak

# Tiap hari 06.00 & 21.00 WIB ambil insight reel @duniakotak.id ke konten-ig/insight/.
on:
  push:
    branches: [main]
    paths: ["konten-ig/insight.py", ".github/workflows/ig-insight.yml"]
  schedule:
    - cron: "7 23,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-insight
  cancel-in-progress: false

jobs:
  insight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: konten-ig
      - name: Ambil insight
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 konten-ig/insight.py
      - name: Simpan
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          for f in konten-ig/token.enc konten-ig/insight; do [ -e "$f" ] && git add "$f"; done; true
          if ! git diff --cached --quiet; then
            git commit -m "IG: insight $(TZ=Asia/Jakarta date +%F)"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
