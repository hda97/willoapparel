name: Insight Instagram sementara (audit)

# Sekali jalan untuk audit akun lain (bukan duniakotak.id). Tidak meng-commit apa pun;
# hasil hanya dicetak ke log. Dihapus lagi setelah audit.
on:
  push:
    branches: [claude/project-thread-yf0kbb]
    paths: [".github/workflows/ig-insight-sementara.yml"]

permissions:
  contents: read

jobs:
  insight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: konten-ig
      - name: Ambil insight willo.apparel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_USERNAME: willo.apparel
          JUMLAH: "30"
        run: |
          python3 konten-ig/insight.py
          python3 - <<'PY'
          import json
          d = json.load(open("konten-ig/insight/terbaru.json"))
          print("AKUN", json.dumps(d["akun"]))
          for r in d["media"]:
              r = {k: v for k, v in r.items() if k not in ("id", "ig_reels_video_view_total_time")}
              print("ROW", json.dumps(r, ensure_ascii=False))
          PY
