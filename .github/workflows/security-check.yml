name: Security patch syntax checks

on:
  pull_request:
    paths:
      - "worker.js"
      - "public/duniakotak/mabar/game.js"
      - "public/duniakotak/index.html"
      - "tests/**"
      - "wrangler.jsonc"
      - "docs/CLOUDFLARE_STAGING_SETUP.md"
      - ".github/workflows/security-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated staging Wrangler config (dry run only)
        run: npx --yes wrangler@4 deploy --dry-run --env staging
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check multiplayer client syntax
        run: node --check public/duniakotak/mabar/game.js
      - name: Run security regression tests
        run: node --test tests/security-patch.test.mjs
