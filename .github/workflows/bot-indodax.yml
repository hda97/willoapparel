name: Bot Indodax (paper trading)

# Paper trading (uang bohongan) dengan harga publik Indodax. Tidak memakai kunci
# API atau secret apa pun dan tidak bisa bertransaksi sungguhan.
# Strategi harian, jadi cukup dicek beberapa kali sehari. Status disimpan di cache Actions.
# Rantai otomatis (disetujui Huda 11 Nov 2026): cron GitHub di repo ini sering dilewati,
# jadi tiap run menunggu ~3 jam lalu memicu run berikutnya. Hanya ada satu rantai:
# run baru (cron atau manual) membatalkan penunggu lama dan menggantikannya.
# Hentikan: Actions > "Bot Indodax (paper trading)" > ... > Disable workflow,
# lalu Cancel run yang sedang menunggu.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bot-indodax
      cancel-in-progress: false
    defaults:
      run:
        working-directory: bot-indodax
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bot-indodax

      - name: Ambil status sebelumnya
        id: status
        uses: actions/cache/restore@v4
        with:
          path: |
            bot-indodax/status_paper.json
            bot-indodax/riwayat_transaksi.csv
            bot-indodax/log_bot.txt
          key: bot-indodax-state-${{ github.run_id }}
          restore-keys: bot-indodax-state-

      - name: Peringatan jika status hilang
        if: steps.status.outputs.cache-matched-key == '' && github.run_number > 1
        run: echo "::warning::Status bot Indodax tidak ditemukan di cache. Bot mulai lagi dari nol."

      - name: Uji otomatis
        run: python3 uji_bot.py

      - name: Cek pasar dan jalankan strategi
        run: python3 bot.py

      - name: Laporan
        if: always()
        run: |
          if [ -f log_bot.txt ]; then tail -n 5000 log_bot.txt > log_bot.tmp && mv log_bot.tmp log_bot.txt; fi
          { echo '```'; python3 bot.py --laporan; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan status
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot-indodax/status_paper.json
            bot-indodax/riwayat_transaksi.csv
            bot-indodax/log_bot.txt
          key: bot-indodax-state-${{ github.run_id }}

  lanjut:
    needs: paper-trading
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    concurrency:
      group: bot-indodax-rantai
      cancel-in-progress: true
    steps:
      - name: Tunggu ~3 jam
        run: sleep 10500

      - name: Picu run berikutnya
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot-indodax.yml --ref main --repo "$GITHUB_REPOSITORY"
