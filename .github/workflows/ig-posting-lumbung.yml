name: Posting Instagram Lumbung

# Terbitkan reel/carousel Lumbung dari konten-ig/antrean-miftakhul_hda/<tanggal WIB>[-n].json
# ke @miftakhul_hda lewat Instagram Graph API resmi (gratis). Tiap file hanya terbit sekali,
# dan satu putaran paling banyak menerbitkan satu file (yang paling awal).
#
# Cron GitHub untuk workflow ini nyaris tidak jalan (18 Nov: dari 05.00 sampai 19.40 WIB tidak ada
# satu pun run terjadwal). Jadi satu run berjalan ±5,5 jam, mengecek antrean tiap 5 menit (selalu
# menarik main terbaru), lalu memicu dirinya sendiri lagi, sama seperti ig-kata-kunci.yml.
# Cron di bawah hanya cadangan kalau rantai putus.

on:
  push:
    branches: [main]
    paths: [".github/workflows/ig-posting-lumbung.yml"]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      tanggal:
        description: "Terbitkan antrean tanggal ini sekarang (YYYY-MM-DD). Kosongkan = cek jadwal biasa."
        required: false
      cek_token:
        description: "Hanya uji token (tanpa posting)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ig-posting-lumbung
  cancel-in-progress: false

jobs:
  posting:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IG_USERNAME: miftakhul_hda
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: konten-ig
      - name: Uji token atau terbitkan tanggal tertentu
        if: ${{ inputs.cek_token || inputs.tanggal != '' && inputs.tanggal != null }}
        env:
          PAKSA_TANGGAL: ${{ inputs.tanggal }}
          CEK_TOKEN: ${{ inputs.cek_token && '1' || '' }}
        run: python3 konten-ig/posting.py
      - name: Cek antrean tiap 5 menit selama ±5,5 jam
        if: ${{ !inputs.cek_token && (inputs.tanggal == '' || inputs.tanggal == null) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          selesai=$((SECONDS + 325*60))
          while [ $SECONDS -lt $selesai ]; do
            git pull --rebase -q origin main || true
            python3 konten-ig/posting.py || echo "Putaran gagal, coba lagi 5 menit lagi."
            git add konten-ig/token-miftakhul_hda.enc konten-ig/antrean-miftakhul_hda 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "IG Lumbung: status posting $(TZ=Asia/Jakarta date +%F)"
              for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
            fi
            sleep 300
          done
      - name: Simpan status (mode tanggal/token)
        if: ${{ always() && (inputs.cek_token || inputs.tanggal != '' && inputs.tanggal != null) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          for f in konten-ig/token-miftakhul_hda.enc konten-ig/antrean-miftakhul_hda; do [ -e "$f" ] && git add "$f"; done; true
          if ! git diff --cached --quiet; then
            git commit -m "IG Lumbung: status posting $(TZ=Asia/Jakarta date +%F)"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
      - name: Sambung run berikutnya
        if: ${{ !cancelled() && !inputs.cek_token && (inputs.tanggal == '' || inputs.tanggal == null) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Jangan bikin rantai ganda: kalau sudah ada run lain yang antre, biarkan run itu yang melanjutkan.
          n=$(gh run list --repo "${{ github.repository }}" --workflow ig-posting-lumbung.yml --status queued --json databaseId -q 'length')
          n2=$(gh run list --repo "${{ github.repository }}" --workflow ig-posting-lumbung.yml --status pending --json databaseId -q 'length')
          if [ "${n:-0}" = "0" ] && [ "${n2:-0}" = "0" ]; then
            gh workflow run ig-posting-lumbung.yml --repo "${{ github.repository }}" --ref main
          else
            echo "Sudah ada run lain yang antre; tidak memicu lagi."
          fi
