name: Insight IG Lumbung (sementara)

# Baca insight @miftakhul_hda ke log saja (tanpa commit). Dihapus setelah dipakai.
on:
  push:
    branches: [claude/project-thread-sb477z]
    paths: [".github/workflows/ig-insight-lumbung-uji.yml"]

permissions:
  contents: read

jobs:
  insight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: konten-ig
      - name: Ambil insight
        env:
          IG_USERNAME: miftakhul_hda
          JUMLAH: "40"
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: |
          python3 konten-ig/insight.py
          python3 -c "import json;d=json.load(open('konten-ig/insight/terbaru.json'));print('JSON='+json.dumps(d,ensure_ascii=False))"
