name: Aplikasi Splitbill Cerdas (APK)

# Build APK Splitbill Cerdas (Expo SDK 51, JS dibundel Hermes, bisa jalan tanpa server dev).
# Hasil diunggah ke Release "splitbill-uji" supaya bisa diunduh & dipasang langsung dari HP.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "aplikasi-splitbill/**"
      - ".github/workflows/aplikasi-splitbill.yml"
  push:
    branches: [main]
    paths:
      - "aplikasi-splitbill/**"
      - ".github/workflows/aplikasi-splitbill.yml"

permissions:
  contents: write

concurrency:
  group: splitbill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aplikasi-splitbill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aplikasi-splitbill/package-lock.json
      - name: Pasang paket
        run: npm ci
      - name: Uji logika
        run: npm test
      - name: Expo prebuild (buat proyek Android)
        run: npx expo prebuild --platform android --no-install
      - name: Build APK release
        working-directory: aplikasi-splitbill/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Siapkan file APK
        run: cp android/app/build/outputs/apk/release/app-release.apk splitbill-cerdas.apk && ls -la splitbill-cerdas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: splitbill-cerdas-apk
          path: aplikasi-splitbill/splitbill-cerdas.apk
          retention-days: 14
      - name: Unggah ke Release splitbill-uji
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: splitbill-uji
          target_commitish: ${{ github.sha }}
          name: Splitbill Cerdas APK uji (terbaru)
          prerelease: true
          make_latest: false
          body: |
            APK uji Splitbill Cerdas v2. Unduh **splitbill-cerdas.apk** di bawah dari HP Android.
            Hapus dulu Splitbill Cerdas versi lama (kunci tanda tangannya beda), lalu ketuk file ini, izinkan "instal dari sumber tidak dikenal", dan Instal.
            Dibangun otomatis dari commit ${{ github.sha }}.
          files: aplikasi-splitbill/splitbill-cerdas.apk
          overwrite_files: true
