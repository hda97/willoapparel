<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sawah Wetan · Dunia Kotak</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13141f">
<link rel="icon" href="/duniakotak/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
<style>
/* Sawah Wetan (Huda 18 Nov 2026): petak sawah Kotak Wetan dijual ke warga, warga beli petak & menanam apa saja.
   Kanvas 3D penuh layar, panel kaca navy seperti Reli Kotak. Muat satu layar HP mendatar tanpa geser (aturan Huda 10 Nov). */
:root{--navy:#2c3150;--kaca:rgba(30,33,56,.82);--teks:#f4f2ff;--redup:rgba(244,242,255,.7);--kuning:#f2c14a;--hijau:#3aa860;--biru:#4aa6e8;--merah:#e0503a;--f:"Montserrat",system-ui,sans-serif;--panel:min(286px,calc(var(--vw,1vw) * 41));color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#a8d8f2;color:var(--teks);font-family:var(--f);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
#kanvas{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
button,a.tombol{font-family:var(--f);cursor:pointer;border:0;color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--kuning);outline-offset:2px}
.kaca{background:var(--kaca);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px}
#atas{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:5px;pointer-events:none;max-width:calc(var(--vw,1vw) * 100 - var(--panel) - 30px)}
.judul small{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;color:#1d2a10;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.judul h1{margin:0;font-size:24px;font-weight:900;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(19,20,31,.4)}
.judul h1 span{color:var(--kuning)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips span{padding:4px 9px;font-size:11.5px;font-weight:900;white-space:nowrap}
#panel{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));right:max(8px,env(safe-area-inset-right,0px));width:var(--panel);padding:10px 11px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.pAtas{display:flex;align-items:center;gap:6px}
.pAtas h2{margin:0;font-size:16px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pAtas a,.pAtas button{flex:0 0 auto;font-size:11px;font-weight:800;padding:6px 9px;border-radius:9px;background:rgba(255,255,255,.13)}
.ket{font-size:11.5px;font-weight:700;line-height:1.35;color:var(--redup);margin:0}
.ket b{color:#fff}
.besar{display:flex;align-items:center;gap:9px}
.besar i{font-style:normal;font-size:34px;line-height:1}
.besar b{display:block;font-size:15px;font-weight:900}
.besar small{display:block;font-size:11px;font-weight:700;color:var(--redup)}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7bd36a,#f2c14a);border-radius:9px}
.utama{display:block;width:100%;text-align:center;background:var(--kuning);color:#1d1d22;font-weight:900;font-size:15px;padding:11px 8px;border-radius:12px;box-shadow:0 4px 0 #b88a1e}
.utama:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a1e}
.utama.biru{background:var(--biru);color:#08233a;box-shadow:0 4px 0 #2a6fa0}
.utama.hijau{background:#6cc85a;color:#0f2a0a;box-shadow:0 4px 0 #3a8a2e}
.utama[disabled]{opacity:.5;pointer-events:none}
.kedua{display:block;width:100%;text-align:center;background:rgba(255,255,255,.12);font-weight:800;font-size:12px;padding:9px;border-radius:11px}
.bawah{margin-top:auto;display:grid;gap:6px}
.mini{display:flex;gap:5px;flex-wrap:wrap}
.mini button{padding:5px 9px;border-radius:9px;background:rgba(242,193,74,.22);font-size:11.5px;font-weight:900}
.legenda{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:10.5px;font-weight:800;color:var(--redup)}
.legenda span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legenda em{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}
/* pilih bibit: kisi 3 kolom, muat tanpa geser */
.bibit{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.bibit button{padding:4px 2px 5px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;min-width:0;line-height:1.1}
.bibit button i{font-style:normal;font-size:19px}
.bibit button b{font-size:10px;font-weight:900;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bibit button small{font-size:8.5px;font-weight:800;color:var(--redup);white-space:nowrap}
.bibit button.mahal{opacity:.42}
/* Sawah v2: pesanan warga (3 kotak sebaris) & mini-game panen (jarum bolak-balik, zona kuning/emas di tengah) */
.pesan{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pesan span{display:flex;flex-direction:column;align-items:center;padding:3px 2px 4px;border-radius:9px;background:rgba(255,255,255,.1);min-width:0;line-height:1.15}
.pesan i{font-style:normal;font-size:17px}
.pesan b{font-size:9.5px;font-weight:900;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pesan small{font-size:9.5px;font-weight:900;color:var(--kuning)}
.pesan span.ok{background:rgba(108,200,90,.28)}
.timing{position:relative;height:30px;border-radius:10px;background:rgba(255,255,255,.14);overflow:hidden}
.timing em{position:absolute;top:0;bottom:0}
.timing .z1{left:33%;right:33%;background:rgba(242,193,74,.45)}
.timing .z2{left:43%;right:43%;background:linear-gradient(90deg,#ffd23a,#fff2a0,#ffd23a)}
.timing i{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px #13141f}
#toast{position:fixed;left:calc((var(--vw,1vw) * 100 - var(--panel)) / 2);top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;max-width:calc(var(--vw,1vw) * 100 - var(--panel) - 30px)}
#toast div{padding:8px 14px;font-size:13px;font-weight:900;text-align:center;animation:muncul 3s forwards}
@keyframes muncul{0%{opacity:0;transform:translateY(8px) scale(.9)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#muat{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#a8d8f2;font-weight:900;font-size:16px;color:#1d2a10}
@media (max-height:340px){.judul h1{font-size:19px}.chips span{padding:3px 7px;font-size:10.5px}#panel{padding:7px 9px;gap:5px}.utama{padding:8px;font-size:13.5px}.besar i{font-size:26px}.ket{font-size:10.5px}.bibit button i{font-size:16px}.pesan i{font-size:14px}.timing{height:24px}.legenda{display:none}.bibit button{padding:2px 1px 3px}.pAtas h2{font-size:14px}.kedua{padding:7px}}
</style>
<script type="importmap">{"imports":{"three":"/duniakotak/three/0.169.0/three.module.min.js","three/addons/geometries/RoundedBoxGeometry.js":"/duniakotak/mabar/js/kotakBulat.js?v=20261108r","three/addons/":"/duniakotak/three/0.169.0/jsm/"}}</script>
</head>
<body>
<canvas id="kanvas"></canvas>
<div id="atas">
 <div class="judul"><small>🌾 SAWAH DESA · KOTAK WETAN</small><h1>Sawah <span>Wetan</span></h1></div>
 <div class="chips"><span class="kaca" id="cKoin">🪙 –</span><span class="kaca" id="cLv" hidden>👨‍🌾 Lv 1</span><span class="kaca" id="cPetak">🌾 Petakku 0</span><span class="kaca" id="cJual">🏷️ – dijual</span></div>
</div>
<div id="panel" class="kaca"></div>
<div id="toast"></div>
<div id="muat">🌾 Menuju sawah…</div>
<script type="module" src="sawah.js?v=20261118c"></script>
</body>
</html>
