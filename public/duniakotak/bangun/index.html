<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tukang Kotak · Dunia Kotak</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13141f">
<link rel="icon" href="/duniakotak/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
<style>
/* Tukang Kotak (Huda 10 Nov 2026): mini-game membangun fasum pemenang voting. Kanvas 3D penuh layar, panel kaca navy. */
:root{--navy:#2c3150;--kaca:rgba(30,33,56,.82);--teks:#f4f2ff;--redup:rgba(244,242,255,.68);--kuning:#f2c14a;--hijau:#3aa860;--merah:#e0503a;--f:"Montserrat",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#bfe4ff;color:var(--teks);font-family:var(--f);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#kanvas{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
button,a.tombol{font-family:var(--f);cursor:pointer;border:0;color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--kuning);outline-offset:2px}
.kaca{background:var(--kaca);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px}
.utama{display:block;width:100%;text-align:center;background:var(--kuning);color:#1d1d22;font-weight:900;font-size:17px;padding:13px;border-radius:14px;box-shadow:0 4px 0 #b88a1e}
.utama:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a1e}
.utama:disabled{opacity:.5}
.kedua{display:block;width:100%;text-align:center;background:rgba(255,255,255,.12);font-weight:800;font-size:13px;padding:10px;border-radius:12px}
.kecil{font-size:11px;line-height:1.45;color:var(--redup);margin:0}
/* LOBI: ringkas, muat satu layar HP mendatar tanpa geser (Huda 10 Nov) */
#lobi{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:min(300px,calc(100vw - 24px));display:flex;flex-direction:column;gap:7px;overflow:hidden}
.judul small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--kuning)}
.judul h1{margin:1px 0 0;font-size:26px;font-weight:900;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(19,20,31,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.judul h1 span{color:var(--kuning)}
.status{padding:8px 11px;display:grid;gap:4px}
.status b{font-size:13px}
.bar{position:relative;height:14px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--hijau),#7ad06a);border-radius:999px}
.bar em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:9.5px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cepat{font-size:11px;font-weight:800;color:#9ef0a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aksi{display:grid;grid-template-columns:1fr auto;gap:7px}
.aksi .kedua{width:auto;padding:0 12px;display:flex;align-items:center}
.aturan{font-size:11px;font-weight:700;color:#fff;padding:6px 10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teladan{display:flex;gap:5px;overflow:hidden}
.teladan span{flex:0 1 auto;min-width:0;font-size:10.5px;font-weight:800;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teladan span.saya{background:rgba(242,193,74,.55);color:#1d1d22}
#dompet{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));padding:8px 13px;font-weight:900;font-size:15px}
/* HUD KERJA (Angkut & Bangun) */
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 14px;width:min(360px,calc(100vw - 220px));min-width:220px}
#hud .atas{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:900}
#hud .atas em{font-style:normal;color:var(--kuning)}
#hud .bar{height:11px;margin:5px 0 4px}
#hud small{display:block;font-size:10.5px;font-weight:800;color:var(--redup);text-align:center}
#hud small b{color:#9ef0a0}
#tas{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));padding:8px 13px;font-weight:900;font-size:16px;text-align:center}
#tas small{display:block;font-size:9.5px;color:var(--redup);font-weight:800}
#tas.penuh{background:rgba(224,80,58,.85)}
#kabur{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));padding:9px 13px;font-size:12px;font-weight:800}
#petunjuk{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 16px;font-size:13px;font-weight:800;text-align:center;max-width:calc(100vw - 300px);min-width:200px}
#stik{position:fixed;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(30,33,56,.45);border:2px solid rgba(255,255,255,.35);touch-action:none}
#stik i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.3)}
#kabar{position:fixed;left:50%;top:84px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none}
#kabar div{padding:8px 14px;font-size:13.5px;font-weight:900;animation:muncul 2.6s forwards}
@keyframes muncul{0%{opacity:0;transform:translateY(8px) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* HASIL: pop up ringkas tanpa geser */
.popup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,24,.45);padding:10px}
.popup .isi{width:min(360px,100%);padding:12px 14px;display:grid;gap:8px;overflow:hidden}
.popup h2{margin:0;font-size:19px;font-weight:900;text-align:center}
.angka{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.angka div{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 2px;text-align:center}
.angka b{display:block;font-size:16px;font-weight:900}.angka small{display:block;font-size:9px;font-weight:800;color:var(--redup)}
.angka div.utamaA{background:rgba(242,193,74,.25)}
.hadiah{text-align:center;font-weight:800;font-size:11.5px;color:var(--redup)}
.hadiah a{color:var(--kuning)}
.dua{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.dua .utama{padding:10px;font-size:15px}.dua .kedua{display:flex;align-items:center;justify-content:center}
@media (max-height:330px){#lobi{gap:5px}.judul h1{font-size:21px}.status{padding:6px 10px}.utama{padding:9px;font-size:15px}#stik{width:104px;height:104px}#petunjuk{bottom:8px;font-size:11.5px;padding:6px 12px}#kabar{top:66px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js","three/addons/geometries/RoundedBoxGeometry.js":"/duniakotak/mabar/js/kotakBulat.js?v=20261108r","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="kanvas"></canvas>

<div id="lobi">
 <div class="judul"><small>🔨 TUKANG KOTAK</small><h1>Bangun <span id="lNama">fasum</span></h1></div>
 <div class="kaca status" id="lStatus"><b>Memuat proyek…</b></div>
 <div class="aksi"><button class="utama" id="bMulai" disabled>🔨 MULAI KERJA</button><a class="kedua tombol kaca" id="bDesa" href="/duniakotak/mabar/">← Desa</a></div>
 <div class="kaca aturan" id="lAturan">Bangun sampai 100% = fasum ⚡ 20 menit lebih cepat + 🪙</div>
 <div class="teladan" id="lTop"></div>
</div>
<div id="dompet" class="kaca" hidden></div>

<div id="hud" class="kaca" hidden><div class="atas"><span id="hNama">Taman Kota</span><em id="hPersen">0%</em></div><div class="bar"><span id="hBar" style="width:0%"></span></div><small id="hSesi">Setor 60 bahan sampai 100%</small></div>
<div id="tas" class="kaca" hidden><span id="tAngka">0/8</span><small>🎒 bahan</small></div>
<div id="stik" hidden><i></i></div>
<div id="petunjuk" class="kaca" hidden></div>
<div id="kabar"></div>
<div id="hasil" class="popup" hidden>
 <div class="isi kaca">
  <h2 id="hsJudul">Misi selesai! 💪 Upah tukang</h2>
  <div class="angka" id="hsRinci"></div>
  <div class="hadiah" id="hsHadiah"></div>
  <div class="dua"><a class="kedua tombol" id="bDesa2" href="/duniakotak/mabar/">Ke desa</a><button class="utama" id="bLagi">🔨 MISI LAGI</button></div>
 </div>
</div>
<script type="module" src="bangun.js?v=20261110f"></script>
</body>
</html>
