<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Portal Filter</title>
<style>
  :root { --ui: rgba(15,18,22,.72); --line: rgba(255,255,255,.18); --acc: #8fe9ff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #cam { display: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--ui); color: #fff; padding: 10px 14px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .btn.on { border-color: var(--acc); color: var(--acc); }
  .btn.rec { background: #d4232f; border-color: #ff7a83; }
  .tag { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--ui); border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px; font-weight: 700; letter-spacing: .06em; font-size: 13px; pointer-events: none; }
  .dl { position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: #fff; color: #111; padding: 9px 16px; border-radius: 999px; font-weight: 700; text-decoration: none; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: #0d1014; padding: 24px; text-align: center; }
  #start h1 { font-size: 26px; margin: 0 0 8px; }
  #start p { color: #b9c2cc; max-width: 420px; margin: 0 auto 18px; }
  #start .go { background: var(--acc); color: #06222b; border: 0; padding: 14px 26px; border-radius: 999px; font-size: 17px; font-weight: 800; }
  #err { color: #ff9a9a; margin-top: 14px; }
</style>
<script type="importmap">
{"imports":{"@mediapipe/tasks-vision":"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"}}
</script>
</head>
<body>
<canvas id="stage" aria-label="Kamera dengan filter portal tangan"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div class="tag" id="tag" hidden>PINK</div>
<a class="dl" id="dl" hidden>Unduh rekaman</a>
<div class="bar" id="bar" hidden>
  <button class="btn" id="bCode" type="button">Gaya kode</button>
  <button class="btn" id="bFlip" type="button">Balik kamera</button>
  <button class="btn" id="bRec" type="button">● Rekam</button>
</div>
<div id="start">
  <div>
    <h1>Portal Filter</h1>
    <p>Bentuk bingkai pakai jempol dan telunjuk kedua tangan. Isi bingkai diberi filter. Untuk ganti efek, cubitkan jempol dan telunjuk salah satu tangan sampai bersentuhan, lalu buka lagi.</p>
    <button class="go" id="go" type="button">Nyalakan kamera</button>
    <p id="err" hidden></p>
  </div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';
const WASM = window.__WASM__ || 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const HAND_MODEL = window.__HAND_MODEL__ || 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $ = id => document.getElementById(id);
const stage = $('stage'), out = stage.getContext('2d'), video = $('cam');
// semua efek digambar di kanvas kamera; kanvas tampil = (editor kode) + kamera
const camc = document.createElement('canvas'), ctx = camc.getContext('2d');
const FILTROS = ['PINK', 'GRID', 'POP ART', 'HALFTONE', 'RGB SPLIT', 'TERMAL', 'SEPIA', 'KACA BURAM'];

let W = 720, H = 1280, S = 1, facing = 'user', stream = null, landmarker = null;
let filtro = 0, kode = true;

/* ---------- WebGL: filter seluruh frame ---------- */
const glc = document.createElement('canvas');
const gl = glc.getContext('webgl', {preserveDrawingBuffer: true, premultipliedAlpha: false});
const VS = `attribute vec2 p; varying vec2 uv; uniform float mir;
void main(){ uv = vec2(mix(p.x*.5+.5, .5-p.x*.5, mir), .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;
const FS = `precision mediump float; varying vec2 uv; uniform sampler2D tex; uniform int mode; uniform vec2 res; uniform float t, s;
float lum(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
vec3 at(vec2 o){ return texture2D(tex, uv + o/res).rgb; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + t*7.13) * 43758.5453); }
vec3 jet(float x){ return clamp(vec3(1.5-abs(4.*x-3.), 1.5-abs(4.*x-2.), 1.5-abs(4.*x-1.)), 0., 1.); }
void main(){
  vec2 px = uv*res; vec3 c = at(vec2(0.)); float g = lum(c); vec3 o = c;
  if (mode == 0) {                       // PINK halftone garis
    bool grid = mod(px.x, 6.*s) < 2.*s || mod(px.y, 6.*s) < 2.*s;
    o = vec3(235.,40.,110.)/255.;
    if (g > .45 && grid) o = vec3(255.,170.,200.)/255.;
    if (g <= .45 && !grid) o = vec3(150.,10.,70.)/255.;
  } else if (mode == 1) {                // GRID (garis digambar terpisah)
    o = mix(c, vec3(1.), .15);
  } else if (mode == 2) {                // POP ART
    float b = (g + lum(at(vec2(1.,0.))) + lum(at(vec2(-1.,0.))) + lum(at(vec2(0.,1.))) + lum(at(vec2(0.,-1.))))/5.;
    o = b > 150./255. ? vec3(255.,150.,20.)/255. : (b > 70./255. ? vec3(240.,30.,110.)/255. : vec3(0.));
  } else if (mode == 3) {                // HALFTONE titik
    float cs = 7.*s; vec2 cell = floor(px/cs); vec2 ctr = (cell+.5)*cs;
    float gc = lum(texture2D(tex, ctr/res).rgb);
    float r = (1.-gc)*cs*.62;
    o = vec3(smoothstep(r-.8, r+.8, length(px-ctr)));
  } else if (mode == 4) {                // RGB SPLIT
    o = vec3(at(vec2(7.*s,0.)).r, c.g, at(vec2(-7.*s,0.)).b);
  } else if (mode == 5) {                // TERMAL
    o = jet(clamp((g-.12)/.76, 0., 1.));
  } else if (mode == 6) {                // SEPIA
    o = clamp(vec3(dot(c, vec3(.393,.769,.189)), dot(c, vec3(.349,.686,.168)), dot(c, vec3(.272,.534,.131))), 0., 1.);
  } else if (mode == 7) {                // KACA BURAM
    vec3 a = vec3(0.); float k = 9.*s;
    for (int i = -2; i <= 2; i++) for (int j = -2; j <= 2; j++) a += at(vec2(float(i), float(j))*k*.5);
    o = mix(a/25., vec3(245./255.), .55);
  }
  gl_FragColor = vec4(o, 1.);
}`;
function sh(type, src){ const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x);
  if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const pl = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
const U = n => gl.getUniformLocation(prog, n);
const uMode = U('mode'), uRes = U('res'), uT = U('t'), uS = U('s'), uMir = U('mir');

function filterFrame(mode, t){
  gl.viewport(0, 0, W, H);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
  gl.uniform1i(uMode, mode); gl.uniform2f(uRes, W, H); gl.uniform1f(uT, t); gl.uniform1f(uS, S);
  gl.uniform1f(uMir, facing === 'user' ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- lapisan portal ---------- */
const layer = document.createElement('canvas'), lc = layer.getContext('2d');
const mask = document.createElement('canvas'), mc = mask.getContext('2d');

function pathPoly(c, q){ c.beginPath(); c.moveTo(q[0][0], q[0][1]); for (let i = 1; i < q.length; i++) c.lineTo(q[i][0], q[i][1]); c.closePath(); }

function drawGrid(c, q){
  const [tl, tr, br, bl] = q, L = (a, b, t) => [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
  c.save(); c.strokeStyle = '#fff'; c.lineWidth = Math.max(1, S); c.beginPath();
  for (let i = 0; i <= 10; i++) { const t = i/10;
    let a = L(tl, tr, t), b = L(bl, br, t); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
    a = L(tl, bl, t); b = L(tr, br, t); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); }
  c.stroke(); c.restore();
}

function renderPortal(q, t, f){
  filterFrame(f, t);
  lc.clearRect(0, 0, W, H); lc.drawImage(glc, 0, 0);
  if (FILTROS[f] === 'GRID') drawGrid(lc, q);
  mc.clearRect(0, 0, W, H); mc.fillStyle = mc.strokeStyle = '#fff';
  pathPoly(mc, q); mc.fill();
  lc.save(); lc.globalCompositeOperation = 'destination-in'; lc.drawImage(mask, 0, 0); lc.restore();
  ctx.drawImage(layer, 0, 0);
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2*S; ctx.lineJoin = 'round'; pathPoly(ctx, q); ctx.stroke();
  ctx.restore();
}

function susunQuad(lms){
  const [a, b] = [...lms].sort((x, y) => x[0][0] - y[0][0]);
  let tl = a[8], tr = b[8], br = b[4], bl = a[4];
  if (tl[1] + tr[1] > br[1] + bl[1]) [tl, bl, tr, br] = [bl, tl, br, tr];
  return [tl, tr, br, bl];
}
function luas(q){ let s = 0; for (let i = 0; i < 4; i++) { const p = q[i], n = q[(i+1)%4]; s += p[0]*n[1] - n[0]*p[1]; } return Math.abs(s)/2; }

/* ---------- tampilan seperti video referensi: editor kode + bilah jendela di atas kamera ---------- */
function drawHeader(o, w, hd){
  const k = w/720, bar = Math.round(35*k), top = hd - bar;
  o.save();
  o.fillStyle = '#1f1f1f'; o.fillRect(0, 0, w, top);
  o.fillStyle = '#181818'; o.fillRect(0, 0, w, 40*k);
  o.font = `${16*k}px system-ui, "Segoe UI", sans-serif`; o.fillStyle = '#c8c8c8'; o.textBaseline = 'middle';
  o.fillText('Edit    Selection    View    Go    Run    ···', 14*k, 20*k);
  o.fillStyle = '#2b2b2b'; o.beginPath(); o.roundRect ? o.roundRect(380*k, 6*k, w - 390*k, 26*k, 6*k) : o.rect(380*k, 6*k, w - 390*k, 26*k); o.fill();
  o.fillStyle = '#8a8a8a'; o.fillText('Portal', 392*k, 20*k);
  o.fillStyle = '#e6e6e6'; o.fillText('main.py   ×', 14*k, 59*k);
  o.fillStyle = '#9a9a9a'; o.fillText('main.py  >  ◎ main', 14*k, 91*k);
  o.font = `${17*k}px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace`;
  const rows = [['9', [['def ', '#569cd6'], ['main', '#dcdcaa'], ['():', '#d4d4d4']]],
    ['63', [['        filtro_index = (filtro_index + 1) % ', '#9cdcfe'], ['len', '#dcdcaa'], ['(FILTROS)', '#d4d4d4']]],
    ['64', [[`    # filter aktif: ${FILTROS[filtro]}`, '#6a9955']]],
    ['65', [['    frame = ', '#9cdcfe'], ['render_portal', '#dcdcaa'], ['(frame, p1, p2, p3, p4, FILTROS[filtro_index])', '#d4d4d4']]]];
  rows.forEach(([n, toks], r) => { const y = (114 + r*24)*k;
    o.fillStyle = '#6e6e6e'; o.textAlign = 'right'; o.fillText(n, 44*k, y); o.textAlign = 'left';
    let x = 58*k; for (const [t, c] of toks) { o.fillStyle = c; o.fillText(t, x, y); x += o.measureText(t).width; } });
  o.fillStyle = '#f0f0f2'; o.fillRect(4*k, top, w - 8*k, bar);
  o.strokeStyle = '#3c786e'; o.lineWidth = 2*k; o.strokeRect(14*k, top + 10*k, 16*k, 14*k);
  o.font = `${16*k}px system-ui, "Segoe UI", sans-serif`; o.fillStyle = '#1e1e1e';
  ['—', '☐', '✕'].forEach((t, i) => o.fillText(t, w - (135 - i*50)*k, top + bar/2));
  o.restore();
}

/* ---------- loop ---------- */
let quadHalus = null, tutupN = 0, gantiTerakhir = -10, lastTs = -1;
// status cubit per sisi layar (kiri/kanan) + efek riak di titik cubit
const cubit = {L: false, R: false}; let riak = [];
const t0 = performance.now();

function setFiltro(i){ filtro = (i + FILTROS.length) % FILTROS.length; $('tag').textContent = FILTROS[filtro]; }

function frame(){
  requestAnimationFrame(frame);
  if (video.readyState < 2 || !landmarker) return;
  if (video.videoWidth !== W || video.videoHeight !== H) resize();
  const t = (performance.now() - t0)/1000;
  let ts = Math.round(performance.now()); if (ts <= lastTs) ts = lastTs + 1; lastTs = ts;
  const res = landmarker.detectForVideo(video, ts);
  const mir = facing === 'user';
  const lms = (res.landmarks || []).map(h => h.map(p => [(mir ? 1 - p.x : p.x)*W, p.y*H]));

  ctx.save(); if (mir) { ctx.translate(W, 0); ctx.scale(-1, 1); } ctx.drawImage(video, 0, 0, W, H); ctx.restore();

  // ganti efek: jempol (4) & telunjuk (8) satu tangan bersentuhan, lalu dibuka lagi
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const lihat = {L: false, R: false};
  for (const lm of lms) {
    const sisi = lms.length === 2 ? (lm[0][0] === Math.min(lms[0][0][0], lms[1][0][0]) ? 'L' : 'R') : (lm[0][0] < W/2 ? 'L' : 'R');
    lihat[sisi] = true;
    const r = dist(lm[4], lm[8]) / Math.max(1, dist(lm[0], lm[5]));
    if (!cubit[sisi] && r < .32) {
      cubit[sisi] = true;
      if (t - gantiTerakhir > .7) { setFiltro(filtro + 1); gantiTerakhir = t;
        riak.push({x: (lm[4][0] + lm[8][0])/2, y: (lm[4][1] + lm[8][1])/2, t}); }
    } else if (cubit[sisi] && r > .5) cubit[sisi] = false;
  }
  for (const k of ['L', 'R']) if (!lihat[k]) cubit[k] = false;

  let terbuka = false, q = null;
  if (lms.length === 2) { q = susunQuad(lms); terbuka = luas(q) > .004*W*H; }
  if (terbuka) {
    tutupN = 0;
    quadHalus = quadHalus ? quadHalus.map((p, i) => [p[0]*.45 + q[i][0]*.55, p[1]*.45 + q[i][1]*.55]) : q;
    renderPortal(quadHalus, t, filtro);
  } else if (++tutupN < 3) {
    if (quadHalus) renderPortal(quadHalus, t, filtro);   // tahan sebentar supaya tidak berkedip
  } else quadHalus = null;
  $('tag').textContent = FILTROS[filtro];
  riak = riak.filter(o => t - o.t < .45);
  for (const o of riak) { const k = (t - o.t)/.45;
    ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 3*S;
    ctx.beginPath(); ctx.arc(o.x, o.y, (10 + 50*k)*S, 0, Math.PI*2); ctx.stroke(); ctx.restore(); }
  const hd = kode ? Math.round(W*228/720) : 0;
  if (stage.width !== W || stage.height !== H + hd) { stage.width = W; stage.height = H + hd; }
  if (kode) drawHeader(out, W, hd);
  out.drawImage(camc, 0, hd);
}

function resize(){
  W = video.videoWidth; H = video.videoHeight; S = Math.min(W, H)/720;
  for (const c of [camc, glc, layer, mask]) { c.width = W; c.height = H; }
}

async function startCam(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: facing, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 30, max: 30}}, audio: false});
  video.srcObject = stream; await video.play();
}

async function initHands(){
  const fs = await FilesetResolver.forVisionTasks(WASM);
  const opt = d => ({baseOptions: {modelAssetPath: HAND_MODEL, delegate: d}, runningMode: 'VIDEO', numHands: 2,
    minHandDetectionConfidence: .5, minTrackingConfidence: .5});
  try { landmarker = await HandLandmarker.createFromOptions(fs, opt('GPU')); }
  catch (e) { landmarker = await HandLandmarker.createFromOptions(fs, opt('CPU')); }
}

$('go').onclick = async () => {
  $('go').disabled = true; $('go').textContent = 'Memuat…';
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Browser ini tidak bisa membuka kamera. Buka link https di Safari atau Chrome.');
    await Promise.all([startCam(), initHands()]);
    $('start').hidden = true; $('bar').hidden = false; $('tag').hidden = kode; setFiltro(0);
    requestAnimationFrame(frame);
  } catch (e) {
    $('err').hidden = false; $('err').textContent = 'Gagal: ' + (e.message || e) + '. Izinkan akses kamera lalu coba lagi.';
    $('go').disabled = false; $('go').textContent = 'Coba lagi';
  }
};
$('bCode').onclick = () => { kode = !kode; $('bCode').classList.toggle('on', kode); $('tag').hidden = kode; };
$('bCode').classList.add('on');
$('bFlip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; try { await startCam(); } catch (e) {} };

/* ---------- rekam layar kanvas ---------- */
let rec = null, chunks = [];
function pickMime(){ for (const m of ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp8', 'video/webm']) if (MediaRecorder.isTypeSupported?.(m)) return m; return ''; }
$('bRec').onclick = () => {
  if (rec) { rec.stop(); return; }
  if (!(stage.captureStream && window.MediaRecorder)) { alert('Rekam tidak didukung di browser ini. Pakai perekam layar HP.'); return; }
  const mime = pickMime(), opts = {videoBitsPerSecond: 6e6}; if (mime) opts.mimeType = mime;
  chunks = []; rec = new MediaRecorder(stage.captureStream(30), opts);
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const type = rec.mimeType || mime || 'video/webm', ext = type.includes('mp4') ? 'mp4' : 'webm';
    const a = $('dl'); a.href = URL.createObjectURL(new Blob(chunks, {type})); a.download = `portal-filter-${Date.now()}.${ext}`;
    a.textContent = `Unduh rekaman (.${ext})`; a.hidden = false;
    rec = null; $('bRec').classList.remove('rec'); $('bRec').textContent = '● Rekam';
  };
  rec.start(500); $('dl').hidden = true; $('bRec').classList.add('rec'); $('bRec').textContent = '■ Stop';
};
</script>
</body>
</html>
